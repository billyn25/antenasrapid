name: Verificar contacto Madrid publicado
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'content/**'
      - 'package.json'
      - '.github/workflows/madrid-contact.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madrid-contact-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar aislamiento y contacto de las 201 paginas
        run: node --test tests/madrid-contact.test.mjs
      - name: Comprobar Madrid en el dominio de produccion
        run: npm run audit:madrid:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contacto-madrid-publicado
          path: .cache/madrid-contact-live.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
