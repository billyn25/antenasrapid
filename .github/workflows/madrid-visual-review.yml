name: Revisar hero y galería de Madrid
on:
  push:
    branches: [review/madrid-hero-gallery]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Construir y auditar producción
        run: |
          mkdir -p .quality
          set -o pipefail
          npm run build:production 2>&1 | tee .quality/build.log
      - name: Preparar navegadores
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Hero, galería, ampliación y búsqueda en móvil y escritorio
        run: python tests/madrid-visuals.browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madrid-visual-verified
          path: .quality/
          include-hidden-files: true
