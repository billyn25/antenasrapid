name: Verificar correccion de canonicas
on:
  push:
    branches: [review/canonical-routing-20261007]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrar referencias canonicas sin cambiar ficheros publicados
        run: |
          mkdir -p .quality
          python3 - <<'PY'
          from pathlib import Path
          import json
          def change(name,a,b):
            p=Path(name);s=p.read_text();assert s.count(a)==1,(name,a,s.count(a));p.write_text(s.replace(a,b))
          change('scripts/prepare-production-assets.mjs',"import path from 'node:path';","import path from 'node:path';\nimport {normalizeCanonicalHtml} from './canonical-urls.mjs';")
          change('scripts/prepare-production-assets.mjs','const urls = [];','normalizeCanonicalHtml(root);\nconst urls = [];')
          change('scripts/audit-production-package.mjs',"import path from 'node:path';","import path from 'node:path';\nimport {canonicalUrl} from './canonical-urls.mjs';")
          change('scripts/audit-production-package.mjs','const exact = `href="${page.path}"`;','const exact = `href="${canonicalUrl(page.path)}"`;')
          change('scripts/audit-production-package.mjs','home.includes(`href="/${segment}/"`)','home.includes(`href="${canonicalUrl(`/${segment}/`)}"`)')
          change('scripts/audit-madrid-postal.mjs',"import assert from 'node:assert/strict';","import assert from 'node:assert/strict';\nimport {canonicalUrl} from './canonical-urls.mjs';")
          change('scripts/audit-madrid-postal.mjs',"urls.includes('https://www.antenasrapid.com'+page.path)","urls.includes(canonicalUrl('https://www.antenasrapid.com'+page.path))")
          change('scripts/serve.mjs',"import path from 'node:path';","import path from 'node:path';\nimport {publicRouteMap} from './canonical-urls.mjs';")
          change('scripts/serve.mjs','const mime=','const publicRoutes=publicRouteMap(root);\nconst mime=')
          change('scripts/serve.mjs','if(fs.existsSync(file)&&fs.statSync(file).isDirectory())','if(!fs.existsSync(file)&&publicRoutes.has(pathname))file=publicRoutes.get(pathname);\n  if(fs.existsSync(file)&&fs.statSync(file).isDirectory())')
          p=Path('package.json');d=json.loads(p.read_text());d['scripts']['audit:production']+=' && node scripts/audit-canonical-urls.mjs';p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git diff --check
      - name: Build completo y auditorias
        run: |
          npm run build:production > .quality/build.log 2>&1
          cp -a dist .quality/first-dist
          CONFIRM_PRODUCTION_PREP=1 npm run prepare:production >> .quality/build.log 2>&1
          npm run audit:production >> .quality/build.log 2>&1
          diff -qr dist .quality/first-dist
          tail -n 20 .quality/build.log
      - name: Preparar navegador
        run: |
          python3 -m pip install playwright==1.51.0
          python3 -m playwright install --with-deps chromium
      - name: Probar navegacion canonica y buscador Madrid
        run: |
          node scripts/serve.mjs > .quality/server.log 2>&1 &
          python3 - <<'PY'
          import time,json,urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          for i in range(30):
            try:urllib.request.urlopen('http://127.0.0.1:4173/',timeout=1);break
            except Exception:time.sleep(.1)
          checks=[]
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            for width in [390,1440]:
              c=b.new_context(viewport={'width':width,'height':844});c.route('https://**/*',lambda r:r.abort());page=c.new_page();page.set_default_timeout(5000)
              for route in ['/','/antenas-cantabria/','/antenas-madrid/','/antenas-madrid/corpa','/antenas-madrid/alcobendas','/antenas-burgos/lerma']:
                r=page.goto('http://127.0.0.1:4173'+route,wait_until='domcontentloaded');assert r.status==200,(route,r.status)
                assert page.locator('h1').count()==1
                assert page.locator('link[rel="canonical"]').get_attribute('href')=='https://www.antenasrapid.com'+route
                assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'),(width,route)
                if route=='/antenas-madrid/':
                  page.locator('input[type="search"]').first.fill('28801');page.wait_for_timeout(200)
                  visible=page.locator('.madrid-service-link:visible');assert visible.count()==1
                  href=visible.first.get_attribute('href');assert 'alcala-de-henares' in href
                  assert page.goto('http://127.0.0.1:4173'+href,wait_until='domcontentloaded').status==200
                checks.append({'width':width,'route':route,'passed':True})
              c.close()
            b.close()
          Path('.quality/browser.json').write_text(json.dumps(checks,indent=2));print('NAVEGACION OK',len(checks))
          PY
      - name: Guardar solo fuentes verificadas
        run: |
          git add scripts/prepare-production-assets.mjs scripts/audit-production-package.mjs scripts/audit-madrid-postal.mjs scripts/serve.mjs package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integra canónicas, sitemaps y enlaces con los destinos HTTP verificados'
          git push origin HEAD:review/canonical-routing-20261007
          git rev-parse HEAD > .quality/verified-commit.txt
          git ls-tree -r HEAD > .quality/verified-tree.txt
          tar --exclude=.git --exclude=.quality --exclude=dist -czf .quality/verified-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-routing-verified
          path: |
            .quality/build.log
            .quality/browser.json
            .quality/verified-commit.txt
            .quality/verified-tree.txt
            .quality/verified-source.tar.gz
          include-hidden-files: true
          retention-days: 7
